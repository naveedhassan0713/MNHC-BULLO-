<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNHC BULLO</title>
<style>
:root{--g:#0f766e;--bg:#f4f6f6;--c:#fff;--t:#1b2a2a;--m:#667;--r:#b91c1c;--o:#b45309;--b:#dde3e3}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header small{opacity:.85}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--b);z-index:5}
nav button{flex:1;padding:12px 1px;border:0;background:none;font-size:11.5px;color:var(--m)}
nav button.on{color:var(--g);font-weight:700;border-top:3px solid var(--g)}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e6f2f1;color:var(--g)}
.tag.red{background:#fde8e8;color:var(--r)}.tag.or{background:#fef3e2;color:var(--o)}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:15px;background:#fff}
textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:14px}
button.p{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button.s,a.s{background:#fff;color:var(--g);border:1px solid var(--g);border-radius:8px;padding:8px 12px;font-size:14px;text-decoration:none}
button.w{background:#25d366;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
button.d{background:#fff;color:var(--r);border:1px solid var(--r);border-radius:8px;padding:8px 12px;font-size:14px}
.m{color:var(--m);font-size:13px}
h2{font-size:16px;margin:14px 0 8px}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:10px}
.g5>div{text-align:center}
.g5 span{display:block;font-size:12px;color:var(--m);margin-bottom:2px}
.g5 input{padding:8px 2px;text-align:center}
.big{font-size:22px;font-weight:700;color:var(--g)}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.modal>div{background:#fff;width:100%;max-height:92vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0;max-width:640px;margin:auto}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:8px;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;font-size:14px}
.seg button.on{background:var(--g);color:#fff}
.att button{flex:1;padding:9px 4px;border:1px solid var(--b);background:#fff;border-radius:8px;font-size:14px}
.att button.P.on{background:#d1fae5;border-color:#059669;color:#065f46;font-weight:700}
.att button.A.on{background:#fde8e8;border-color:var(--r);color:var(--r);font-weight:700}
.att button.L.on{background:#fef3e2;border-color:var(--o);color:var(--o);font-weight:700}
.bar{height:6px;background:#e5eaea;border-radius:4px;overflow:hidden;margin:2px 0 4px}
.bar i{display:block;height:100%;background:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lnk{color:var(--r);font-size:13px}
.regw{overflow-x:auto;background:#fff;border:1px solid var(--b);border-radius:10px;margin-bottom:10px}
.reg{border-collapse:collapse;font-size:12px}
.reg th,.reg td{border:1px solid var(--b);padding:0}
.reg th{background:#f0f4f4;font-weight:600;padding:3px 4px;text-align:center}
.reg th.nm{position:sticky;left:0;text-align:left;min-width:92px;padding:4px 6px;z-index:1}
.reg th.nm small{display:block;color:var(--m);font-weight:400}
.reg th.sun{background:#e1e8e8}
.rc{min-width:30px;height:36px;text-align:center;font-weight:700}
.rc.P{background:#d1fae5;color:#065f46}.rc.A{background:#fde8e8;color:var(--r)}.rc.L{background:#fef3e2;color:var(--o)}
.tot{padding:0 6px!important;white-space:nowrap}
</style>
</head>
<body>
<header><h1>MNHC BULLO</h1><small id="sub">Field staff records &amp; performance</small></header>
<main id="app"></main>
<nav>
 <button data-t="daily" class="on">Daily</button>
 <button data-t="women">Women</button>
 <button data-t="staff">Staff</button>
 <button data-t="reg">Register</button>
 <button data-t="rep">Reports</button>
 <button data-t="data">Backup</button>
</nav>
<div id="modal" class="modal hide"><div id="mbody"></div></div>

<script>
const KEY='mnhc_bullo_v3',CFG='mnhc_sync_cfg',META='mnhc_sync_meta';
const IND=[['anc','ANC'],['edd','EDD']];
const TYPES=['staff','women','visits','entries','attend'];
let db={staff:[],women:[],visits:[],entries:[],attend:[],targets:{},del:[]};
function norm(d){
 const o={staff:d.staff||[],women:d.women||[],visits:d.visits||[],entries:d.entries||[],attend:d.attend||[],targets:d.targets||{},del:d.del||[]};
 o.entries.forEach(e=>{e.id='e_'+e.sid+'_'+e.date});
 o.attend.forEach(a=>{a.id='a_'+a.sid+'_'+a.date});
 return o;
}
function load(){try{const s=localStorage.getItem(KEY);if(s)db=norm(JSON.parse(s))}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save: storage full or blocked')}}
function save(){persist();scheduleSync()}
load();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'-';
const eddFromLMP=l=>addDays(l,280);
const inR=(d,f,t)=>d>=f&&d<=t;
const sName=id=>(db.staff.find(l=>l.id===id)||{}).name||'?';
const wk=w=>Math.max(0,Math.floor(diff(today(),addDays(w.edd,-280))/7));
const wOf=v=>db.women.find(x=>x.id===v.wid);
const getE=(sid,d)=>db.entries.find(e=>e.sid===sid&&e.date===d);
const getAtt=(sid,d)=>(db.attend.find(a=>a.sid===sid&&a.date===d)||{}).status||'';
const monthLabel=f=>new Date(f+'T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
let showDel=false;
let tab='daily',dDate=today(),sel='',repMode='month',repDate=today(),repRole='',rSid='',rMon=today().slice(0,7),rgMon=today().slice(0,7);

// ---------- deletions (tombstones so deletes sync) ----------
function tomb(t,id){db.del=db.del.filter(x=>!(x.t===t&&x.id===id));db.del.push({t,id,ts:Date.now()})}
function untomb(t,id){db.del=db.del.filter(x=>!(x.t===t&&x.id===id))}
function rm(t,pred){db[t]=db[t].filter(r=>{if(pred(r)){tomb(t,r.id);return false}return true})}

// ---------- shell ----------
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===(tab==='rec'?'staff':tab)));
 $('#app').innerHTML=({daily:vDaily,women:vWomen,staff:vStaff,reg:vReg,rep:vRep,data:vData,rec:vRec}[tab])();
 window.scrollTo(0,0);
}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.remove('hide')}
function closeM(){$('#modal').classList.add('hide')}
function staffFilter(){return `<select onchange="sel=this.value;render()"><option value="">All staff</option>${db.staff.map(l=>`<option value="${l.id}" ${sel===l.id?'selected':''}>${esc(l.name)} (${l.role})</option>`).join('')}</select>`}
const tel=p=>p?`<a class="s" href="tel:${esc(p)}">Call</a>`:'';
const wa=(p,txt)=>`<button class="w" onclick="waOpen(${esc(JSON.stringify(txt||''))},'${esc(p||'')}')">WhatsApp</button>`;

// ---------- WhatsApp ----------
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='92'+d.slice(1);return d}
function waOpen(text,phone){window.open('https://wa.me/'+(phone?waNum(phone):'')+'?text='+encodeURIComponent(text||''),'_blank')}

// ---------- counts ----------
function dayC(sid,d){
 const e=getE(sid,d)||{};
 const o={anc:e.anc||0,edd:e.edd||0};
 o.anc+=db.visits.filter(v=>v.date===d&&(wOf(v)||{}).lhw===sid).length;
 return o;
}
function stats(s,f,t){
 const o={anc:0,edd:0};
 db.entries.filter(e=>e.sid===s.id&&inR(e.date,f,t)).forEach(e=>IND.forEach(([k])=>o[k]+=e[k]||0));
 o.anc+=db.visits.filter(v=>inR(v.date,f,t)&&(wOf(v)||{}).lhw===s.id).length;
 o.edd+=db.women.filter(w=>w.lhw===s.id&&inR(w.edd,f,t)).length;
 const at=st=>db.attend.filter(a=>a.sid===s.id&&a.status===st&&inR(a.date,f,t)).length;
 o.P=at('P');o.A=at('A');o.L=at('L');
 o.total=o.anc+o.edd;return o;
}

// ---------- attendance ----------
function setAttOn(sid,d,st){
 const a=db.attend.find(x=>x.sid===sid&&x.date===d);
 if(!st){if(a)rm('attend',x=>x===a)}
 else if(a)a.status=st;
 else{const id='a_'+sid+'_'+d;db.attend.push({id,sid,date:d,status:st});untomb('attend',id)}
 save();
}
function setAtt(sid,st){setAttOn(sid,dDate,getAtt(sid,dDate)===st?'':st);render()}
function allPresent(){db.staff.forEach(s=>{if(!getAtt(s.id,dDate))setAttOn(s.id,dDate,'P')});render()}
function setNum(sid,k,v){
 let e=getE(sid,dDate);
 if(!e){const id='e_'+sid+'_'+dDate;e={id,sid,date:dDate,anc:0,edd:0};db.entries.push(e);untomb('entries',id)}
 e[k]=Math.max(0,parseInt(v)||0);save();
}

// ---------- Daily ----------
function backupBanner(){
 if(!db.staff.length)return'';
 const c=cfg();if(c.url&&c.key&&c.auto!==false)return'';
 const l=lastBackup();if(l&&diff(today(),l)<7)return'';
 return `<div class="card" style="border-color:var(--o);background:#fef3e2"><b>Back up your data</b><p class="m" style="margin:4px 0 8px">${l?'Last backup was '+diff(today(),l)+' days ago.':'You have not made a backup yet.'} If the app is uninstalled or the phone is lost, data is lost.</p><button class="p" onclick="tab='data';render()">Go to Backup</button></div>`;
}
function vDaily(){
 if(!db.staff.length)return `<div class="card"><p>Add your LHWs and CHIs first.</p><button class="p" onclick="tab='staff';render()">Go to Staff</button></div>`;
 const card=s=>{const e=getE(s.id,dDate)||{};const st=getAtt(s.id,dDate);
  const rc=dayC(s.id,dDate);
  const recd=[['ANC',rc.anc-(e.anc||0)]].filter(x=>x[1]>0).map(x=>x.join(' ')).join(' · ');
  return `<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="tag">${s.role}</span></div>
  <div class="row att" style="margin-top:8px">
  <button class="P ${st==='P'?'on':''}" onclick="setAtt('${s.id}','P')">Present</button>
  <button class="A ${st==='A'?'on':''}" onclick="setAtt('${s.id}','A')">Absent</button>
  <button class="L ${st==='L'?'on':''}" onclick="setAtt('${s.id}','L')">Leave</button></div>
  <div class="m" style="margin-top:8px">Quick counts (extra, not already entered as individual records):</div>
  <div class="g5" style="margin-top:4px">${IND.map(([k,n])=>`<div><span>${n}</span><input type="number" inputmode="numeric" min="0" value="${e[k]||''}" placeholder="0" onchange="setNum('${s.id}','${k}',this.value)"></div>`).join('')}</div>
  ${recd?`<div class="m" style="margin-top:6px">From individual records today: ${recd}</div>`:''}</div>`};
 return backupBanner()+`<div class="card"><label style="margin-top:0">Date</label>
 <div class="row"><input type="date" value="${dDate}" onchange="dDate=this.value||today();render()">
 <button class="s" style="white-space:nowrap" onclick="allPresent()">All present</button></div>
 <p class="m" style="margin:8px 0 0">Mark attendance here (or in the Register tab). Visits entered under Women are counted automatically; use quick counts only for work you are not recording individually.</p></div>
 ${['LHW','CHI'].map(r=>{const l=db.staff.filter(s=>s.role===r);return l.length?`<h2>${r}s</h2>`+l.map(card).join(''):''}).join('')}`;
}

// ---------- Attendance register ----------
function monthRange(m){const y=+m.slice(0,4),mo=+m.slice(5,7);return[iso(new Date(y,mo-1,1)),iso(new Date(y,mo,0))]}
function regTot(sid,f,t){const c=st=>db.attend.filter(a=>a.sid===sid&&a.status===st&&inR(a.date,f,t)).length;return `${c('P')}/${c('A')}/${c('L')}`}
function shiftReg(n){const d=new Date(rgMon+'-01T00:00:00');d.setMonth(d.getMonth()+n);rgMon=iso(d).slice(0,7);render()}
function regStaff(){return['LHW','CHI'].flatMap(r=>db.staff.filter(s=>s.role===r))}
function vReg(){
 if(!db.staff.length)return '<div class="card"><p>Add staff first.</p><button class="p" onclick="tab=\'staff\';render()">Go to Staff</button></div>';
 const[f,t]=monthRange(rgMon);const n=+t.slice(8);
 const hdr=[...Array(n)].map((_,i)=>{const wd=new Date(addDays(f,i)+'T00:00:00').getDay();return `<th class="${wd===0?'sun':''}">${i+1}<br><small>${'SMTWTFS'[wd]}</small></th>`}).join('');
 const rows=regStaff().map(s=>{
  const cells=[...Array(n)].map((_,i)=>{const d=addDays(f,i),st=getAtt(s.id,d);return `<td class="rc ${st}" onclick="cyc(this,'${s.id}','${d}')">${st}</td>`}).join('');
  return `<tr><th class="nm">${esc(s.name)}<small>${s.role}</small></th>${cells}<td class="tot" id="rt_${s.id}">${regTot(s.id,f,t)}</td></tr>`}).join('');
 return `<div class="card"><div class="row"><button class="s" onclick="shiftReg(-1)">‹</button><b>Attendance · ${monthLabel(f)}</b><button class="s" onclick="shiftReg(1)">›</button></div>
 <p class="m" style="margin:8px 0 0">Tap a box to change: P (present) → A (absent) → L (leave) → empty. Last column = P/A/L totals.</p>
 <div class="wrap"><button class="s" onclick="regCSV()">Export CSV</button><button class="w" onclick="regWA()">Send on WhatsApp</button></div></div>
 <div class="regw"><table class="reg"><tr><th class="nm">Staff</th>${hdr}<th>P/A/L</th></tr>${rows}</table></div>`;
}
function cyc(td,sid,d){
 const nx={'':'P',P:'A',A:'L',L:''}[getAtt(sid,d)];
 setAttOn(sid,d,nx);
 td.className='rc '+nx;td.textContent=nx;
 const[f,t]=monthRange(d.slice(0,7));const e=document.getElementById('rt_'+sid);if(e)e.textContent=regTot(sid,f,t);
}
function regWA(){
 const[f,t]=monthRange(rgMon);
 let s=`*MNHC BULLO – Attendance ${monthLabel(f)}*\n(Present / Absent / Leave)\n`;
 regStaff().forEach(x=>{s+=`\n${x.name} (${x.role}): ${regTot(x.id,f,t)}`});
 waOpen(s);
}
function regCSV(){
 const[f,t]=monthRange(rgMon);const n=+t.slice(8);
 const rows=[['Role','Name',...[...Array(n)].map((_,i)=>i+1),'Present','Absent','Leave']];
 regStaff().forEach(s=>{const r=[s.role,s.name];for(let i=0;i<n;i++)r.push(getAtt(s.id,addDays(f,i)));const [p,a,l]=regTot(s.id,f,t).split('/');rows.push([...r,p,a,l])});
 dl(`attendance-${rgMon}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

// ---------- Women ----------
function nextDue(w){
 const vs=db.visits.filter(v=>v.wid===w.id).map(v=>v.date).sort();
 if(!vs.length)return today();
 const k=wk(w);return addDays(vs[vs.length-1],k>=36?7:k>=28?14:28);
}
function wCard(w){
 const d=diff(w.edd,today());const cnt=db.visits.filter(v=>v.wid===w.id).length;
 const remind=`Assalam o Alaikum ${w.name}, this is MNHC BULLO. Your next antenatal check-up is due. Your expected delivery date is ${fmt(w.edd)}. Please contact your LHW ${sName(w.lhw)}.`;
 return `<div class="card"><div class="row"><b>${esc(w.name)}</b><span class="tag">${esc(sName(w.lhw))}</span></div>
 <div class="m">${w.age?esc(w.age)+' yrs · ':''}${w.phone?esc(w.phone)+' · ':''}${esc(w.village||'')}${w.gp?' · '+esc(w.gp):''}</div>
 <div class="m">${w.risk?'<span class="tag red">High risk</span> ':''}EDD <b>${fmt(w.edd)}</b> (${d>=0?d+' days left':Math.abs(d)+' days past'}) · ~${wk(w)} wks · ${cnt} ANC visits</div>
 <div class="wrap"><button class="p" onclick="visitForm('${w.id}')">+ ANC visit</button>
 <button class="s" onclick="womanForm('${w.id}')">Edit / EDD</button>
 <button class="s" onclick="deliver('${w.id}')">Delivered</button>${tel(w.phone)}${w.phone?wa(w.phone,remind):''}</div></div>`;
}
function deliver(id){const w=db.women.find(x=>x.id===id);const d=prompt('Delivery date (YYYY-MM-DD)',today());if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){w.delivered=d;save();render()}}
function vWomen(){
 const act=db.women.filter(w=>!w.delivered&&(!sel||w.lhw===sel)).sort((a,b)=>a.edd.localeCompare(b.edd));
 const due=act.filter(w=>nextDue(w)<=today());
 const dl_=db.women.filter(w=>w.delivered&&(!sel||w.lhw===sel));
 return `<div class="card">${staffFilter()}<div style="margin-top:8px"><button class="p" style="width:100%" onclick="womanForm(null,'${sel}')">+ Pregnant woman</button></div>
 <div class="m" style="margin-top:8px">${act.length} active pregnancies · ${due.length} ANC due or overdue</div></div>
 ${due.length?`<h2>ANC due / overdue</h2>`+due.map(wCard).join(''):''}
 <h2>All EDDs (nearest first)</h2>
 ${act.length?act.filter(w=>!due.includes(w)).map(wCard).join('')||'<p class="m">All shown above.</p>':'<p class="m">No active pregnancies.</p>'}
 ${dl_.length?`<button class="s" style="width:100%;margin:10px 0" onclick="showDel=!showDel;render()">${showDel?'Hide':'Show'} delivered (${dl_.length})</button>`+(showDel?dl_.map(w=>`<div class="card"><b>${esc(w.name)}</b> <span class="tag">${esc(sName(w.lhw))}</span><div class="m">EDD was ${fmt(w.edd)} · delivered ${fmt(w.delivered)}</div><button class="s" onclick="womanForm('${w.id}')">Edit</button></div>`).join(''):''):''}`;
}
function womanForm(id,pre){
 if(!db.staff.length){alert('Add an LHW or CHI first');tab='staff';return render()}
 const w=db.women.find(x=>x.id===id)||{};const cur=w.lhw||pre||sel||'';
 modal(`<h2>${id?'Edit':'Add'} pregnant woman</h2>
 <label>Under LHW / CHI</label><select id="f0">${db.staff.map(l=>`<option value="${l.id}" ${l.id===cur?'selected':''}>${esc(l.name)} (${l.role})</option>`).join('')}</select>
 <label>Woman's name</label><input id="f1" value="${esc(w.name)}">
 <div class="grid"><div><label>Age</label><input id="f2" type="number" value="${esc(w.age)}"></div>
 <div><label>Phone</label><input id="f3" type="tel" value="${esc(w.phone)}"></div></div>
 <label>Village / address</label><input id="f4" value="${esc(w.village)}">
 <label>LMP (last menstrual period)</label><input id="f5" type="date" value="${esc(w.lmp)}" onchange="if(this.value)$('#f6').value=eddFromLMP(this.value)">
 <label>EDD (auto from LMP; edit if ultrasound differs)</label><input id="f6" type="date" value="${esc(w.edd)}">
 <label>Gravida / Para</label><input id="f7" value="${esc(w.gp)}" placeholder="e.g. G3P2">
 <label><input type="checkbox" id="f8" style="width:auto" ${w.risk?'checked':''}> High risk</label>
 <label>Delivery date (when delivered)</label><input id="f9" type="date" value="${esc(w.delivered)}">
 <div class="row" style="margin-top:14px"><button class="s" onclick="closeM()">Cancel</button>
 ${id?`<button class="d" onclick="delWoman('${id}')">Delete</button>`:''}
 <button class="p" onclick="saveWoman('${id||''}')">Save</button></div>`);
}
function saveWoman(id){
 const name=$('#f1').value.trim();let edd=$('#f6').value;const lmp=$('#f5').value;
 if(!name)return alert('Name required');
 if(!edd&&lmp)edd=eddFromLMP(lmp);
 if(!edd)return alert('Enter LMP or EDD');
 const o={lhw:$('#f0').value,name,age:$('#f2').value,phone:$('#f3').value.trim(),village:$('#f4').value.trim(),lmp,edd,gp:$('#f7').value.trim(),risk:$('#f8').checked,delivered:$('#f9').value,updated:today()};

function dl(name,text,type){
 try{const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function clip(s,ok){
 if(navigator.clipboard)navigator.clipboard.writeText(s).then(ok,()=>alert('Copy failed'));
 else{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();ok()}
}
function copyBackup(){markBackup();clip(JSON.stringify(db),()=>alert('Copied. Paste it into Notes or a chat to keep it.'))}

function importFile(inp,mode){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>mode==='merge'?mergeText(r.result):importText(r.result);r.readAsText(f)}
function mergeText(txt){
 let raw;try{raw=JSON.parse(txt);if(!raw.staff)throw 0}catch(e){return alert('Invalid backup')}
 if(!confirm('Merge this backup into the data on this phone?'))return;
 const d=norm(raw),add={staff:0,women:0,visits:0,entries:0,attend:0},map={};
 d.staff.forEach(s=>{
  const ex=db.staff.find(x=>x.id===s.id)||db.staff.find(x=>x.role===s.role&&String(x.name).trim().toLowerCase()===String(s.name).trim().toLowerCase());
  if(ex)map[s.id]=ex.id;else{db.staff.push(s);map[s.id]=s.id;add.staff++}
 });
 const mp=id=>map[id]||id;
 d.women.forEach(w=>{w.lhw=mp(w.lhw);const ex=db.women.find(x=>x.id===w.id);
  if(!ex){db.women.push(w);add.women++}else if((w.updated||'')>(ex.updated||''))Object.assign(ex,w)});
 d.visits.forEach(v=>{if(!db.visits.some(x=>x.id===v.id)){db.visits.push(v);add.visits++}});
 d.entries.forEach(e=>{e.sid=mp(e.sid);e.id='e_'+e.sid+'_'+e.date;const ex=getE(e.sid,e.date);
  if(!ex){db.entries.push(e);add.entries++}else IND.forEach(([k])=>{if(!ex[k]&&e[k])ex[k]=e[k]})});
 d.attend.forEach(a=>{a.sid=mp(a.sid);a.id='a_'+a.sid+'_'+a.date;if(!db.attend.some(x=>x.sid===a.sid&&x.date===a.date)){db.attend.push(a);add.attend++}});
 for(const k in d.targets)if(!db.targets[k]&&d.targets[k])db.targets[k]=d.targets[k];
 save();render();
 alert(`Merged: ${add.women} women, ${add.visits} ANC visits, ${add.entries} daily counts, ${add.attend} attendance marks, ${add.staff} staff added.`);
}

function cfg(){try{return JSON.parse(localStorage.getItem(CFG))||{}}catch(e){return{}}}
function setCfg(o){try{localStorage.setItem(CFG,JSON.stringify(o))}catch(e){}}

function metaSave(m){try{localStorage.setItem(META,JSON.stringify(m))}catch(e){}}
const hs=r=>{const c=Object.assign({},r);delete c.ts;return JSON.stringify(c)};
let syncing=false,syncT=null,syncMsg='';
function setSync(m){syncMsg=m;const e=document.getElementById('syncst');if(e)e.textContent=m;$('#sub').textContent=cfg().url?'Online sync · '+m:'Field staff records & performance'}
const hhmm=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function canRender(){const a=document.activeElement;return $('#modal').classList.contains('hide')&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&tab!=='reg'}
function scheduleSync(){const c=cfg();if(!c.url||!c.key||c.auto===false)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),4000)}
function saveSync(){
 const url=$('#sy1').value.trim(),key=$('#sy2').value.trim();
 if(!url||!key)return alert('Enter both the sync link and the access key');
 if(!/^https:\/\/script\.google\.com\//.test(url))return alert('The sync link should start with https://script.google.com/');
 setCfg({url,key,auto:$('#sy3').checked});syncNow(true);
}
function shareSetup(){
 const c=cfg();if(!c.url||!c.key)return alert('Save the sync link and key first');
 waOpen(`MNHC BULLO app – sync setup\nOpen the app > Backup tab > Online sync, then enter:\n\nLink: ${c.url}\nKey: ${c.key}`);
}
async function syncNow(manual){
 const c=cfg();
 if(!c.url||!c.key){if(manual)alert('Enter the sync link and key first');return}
 if(syncing)return;
 syncing=true;setSync('Syncing…');
 try{
  const m=metaLoad(),now=Date.now(),push=[];
  TYPES.forEach(t=>db[t].forEach(r=>{
   const h=hs(r),k=t+':'+r.id;
   if(m.h[k]!==h){r.ts=now;m.h[k]=h}
   if((r.ts||0)>=m.pushed)push.push({t,id:r.id,ts:r.ts,d:r});
  }));
  const del=db.del.filter(x=>x.ts>=m.pushed);
  const res=await fetch(c.url,{method:'POST',body:JSON.stringify({key:c.key,since:m.pulled,push,del})});
  const j=await res.json();
  if(!j.ok)throw new Error(j.err||'Server refused');
  let ch=0;
  (j.recs||[]).forEach(x=>{
   const arr=db[x.t];if(!arr)return;
   const i=arr.findIndex(r=>r.id===x.id);
   if(i<0){if(db.del.some(z=>z.t===x.t&&z.id===x.id&&z.ts>=x.ts))return;arr.push(x.d);ch++}
   else if((x.ts||0)>(arr[i].ts||0)){arr[i]=x.d;ch++}
   else return;
   m.h[x.t+':'+x.id]=hs(x.d);
  });
  (j.del||[]).forEach(x=>{const arr=db[x.t];if(!arr)return;const i=arr.findIndex(r=>r.id===x.id);if(i>=0&&(arr[i].ts||0)<=x.ts){arr.splice(i,1);ch++}});
  m.pushed=now;m.pulled=j.now;metaSave(m);
  db.del=db.del.filter(x=>x.ts>now-30*864e5);
  persist();
  setSync('Synced '+hhmm());
  if(ch&&canRender())render();
 }catch(e){setSync('Not synced ('+(e.message||'offline')+')')}
 finally{syncing=false}
}
setInterval(()=>{const c=cfg();if(c.url&&c.key&&c.auto!==false&&!document.hidden)syncNow(false)},60000);
window.addEventListener('online',()=>syncNow(false));
setTimeout(()=>{const c=cfg();if(c.url&&c.key&&c.auto!==false)syncNow(false)},1500);

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
render();
if(cfg().url)setSync('ready');
</script>
